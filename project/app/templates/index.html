<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Email Organizer Agent</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <div class="app-container">
        <header class="glass-panel main-header">
            <div class="logo">
                <h1>Email Organizer Agent</h1>
                <p class="subtitle">AI-Powered Academic Assistant</p>
            </div>
            <button id="process-inbox-btn" class="primary-btn pulse">Process Inbox</button>
        </header>

        <main>
            <!-- High-Priority Reminder Notifications Container -->
            <div id="reminder-banner-container" class="reminder-banner-container"></div>

            <section class="summary-cards" id="metrics-container">
                <!-- Metrics injected by JS -->
            </section>
            
            <div class="system-diagnostics-container">
                <section class="panel glass-panel diagnostics-panel">
                    <h2><span class="icon">⚙️</span> System Diagnostics</h2>
                    <div class="content-scroll" id="diagnostics-list">
                        <!-- Diagnostics injected by JS -->
                    </div>
                </section>
                
                <section class="panel glass-panel pipeline-panel">
                    <h2><span class="icon">🔄</span> Agent Pipeline</h2>
                    <div class="content-scroll" id="pipeline-list">
                        <!-- Pipeline status injected by JS -->
                    </div>
                </section>
            </div>

            <div class="dashboard-grid">
                <section class="panel glass-panel" id="inbox-section">
                    <h2><span class="icon">📥</span> Triaged Inbox</h2>
                    <div class="content-scroll" id="inbox-list"></div>
                </section>

                <section class="panel glass-panel" id="drafts-section">
                    <h2><span class="icon">📝</span> Draft Queue</h2>
                    <div class="content-scroll" id="drafts-list"></div>
                </section>
                
                <section class="panel glass-panel" id="tasks-section">
                    <h2><span class="icon">✅</span> Action Items</h2>
                    <div class="content-scroll" id="tasks-list"></div>
                </section>

                <section class="panel glass-panel" id="meetings-section">
                    <h2><span class="icon">📅</span> Meeting Requests</h2>
                    <div class="content-scroll" id="meetings-list"></div>
                </section>

                <section class="panel glass-panel" id="reminders-section">
                    <div style="display: flex; justify-content: space-between; align-items: center; padding: 14px 20px; border-bottom: 1px solid var(--glass-border); background: rgba(0,0,0,0.2);">
                        <h2 style="padding: 0; border: none; background: transparent; font-size: 1.15rem; margin: 0;"><span class="icon">🔔</span> Priority Reminders</h2>
                        <div style="display: flex; align-items: center; gap: 8px; font-size: 0.85rem;">
                            <label for="default-reminder-delay" style="opacity: 0.8; font-size: 0.8rem;">Interval:</label>
                            <select id="default-reminder-delay" class="input-field" style="width: auto; padding: 4px 8px; font-size: 0.8rem; margin: 0;">
                                <option value="5">5 mins</option>
                                <option value="10">10 mins</option>
                                <option value="15">15 mins</option>
                                <option value="30">30 mins</option>
                                <option value="60">1 hour</option>
                            </select>
                        </div>
                    </div>
                    <div class="content-scroll" id="reminders-list"></div>
                </section>

                <section class="panel glass-panel" id="followups-section">
                    <h2><span class="icon">⏰</span> Follow-ups</h2>
                    <div class="content-scroll" id="followups-list"></div>
                </section>

                <section class="panel glass-panel" id="audit-section">
                    <h2><span class="icon">🛡️</span> Approval History</h2>
                    <div class="content-scroll" id="audit-list"></div>
                </section>
            </div>
        </main>
    </div>
    
    <!-- Modal for Draft Editing -->
    <div id="draft-modal" class="modal">
        <div class="modal-content glass-panel">
            <h3>Edit Draft</h3>
            <input type="hidden" id="edit-draft-id">
            <div class="form-group">
                <label>Subject</label>
                <input type="text" id="edit-draft-subject" class="input-field">
            </div>
            <div class="form-group">
                <label>Body</label>
                <textarea id="edit-draft-body" class="input-field" rows="5"></textarea>
            </div>
            <div class="modal-actions">
                <button id="save-draft-btn" class="primary-btn">Save</button>
                <button id="cancel-draft-btn" class="secondary-btn">Cancel</button>
            </div>
        </div>
    </div>

    <!-- Modal for Snooze Selection -->
    <div id="snooze-modal" class="modal">
        <div class="modal-content glass-panel">
            <h3>Snooze Reminder</h3>
            <input type="hidden" id="snooze-reminder-id">
            <div class="form-group">
                <label>Choose Snooze Duration</label>
                <select id="snooze-interval-select" class="input-field">
                    <option value="5">5 minutes</option>
                    <option value="10">10 minutes</option>
                    <option value="15">15 minutes</option>
                    <option value="30">30 minutes</option>
                    <option value="60">1 hour</option>
                    <option value="custom">Custom duration (minutes)...</option>
                </select>
            </div>
            <div class="form-group" id="custom-snooze-group" style="display: none;">
                <label>Custom Duration in Minutes</label>
                <input type="number" id="custom-snooze-minutes" class="input-field" min="1" placeholder="e.g. 45">
            </div>
            <div class="modal-actions">
                <button id="confirm-snooze-btn" class="primary-btn">Snooze</button>
                <button id="cancel-snooze-btn" class="secondary-btn">Cancel</button>
            </div>
        </div>
    </div>

    <script src="/static/js/app.js"></script>
</body>
</html>
